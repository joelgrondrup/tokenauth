---
Name: tokenauth
---
# Lifetime of the short-lived pairing token embedded in the QR code (seconds).
Joelgrondrup\Tokenauth\Model\PairingToken:
  lifetime: 120

# Lifetime of the device token stored on the phone (seconds). Default: 30 days.
# Set sliding_expiry to false for a hard expiry a fixed period after pairing.
Joelgrondrup\Tokenauth\Model\DeviceToken:
  lifetime: 2592000
  sliding_expiry: true

# cors_allow_origin: set (e.g. 'https://app.example.com' or '*') to enable CORS
#   for browser-based Flutter web builds. Empty = no CORS headers.
# require_css / require_javascript: theme assets to load on the QR page so it
#   picks up your styling (the default controller does not run your
#   PageController::init()). See "Styling / theming the QR page" in the README.
Joelgrondrup\Tokenauth\Controllers\MobileLoginPageController:
  cors_allow_origin: ''
  require_css: []
  require_javascript: []
